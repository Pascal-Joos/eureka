plugins {
    id("net.ltgt.errorprone") version "3.0.1"
    //id 'com.diffplug.spotless' version '6.25.0'
}

apply plugin: "java"

repositories {
    mavenLocal()
    mavenCentral()
}

//spotless {
//    java {
//        googleJavaFormat('1.17.0') // or latest compatible with Java 17
//        target 'src/**/*.java'
//    }
//}

dependencies {
    implementation project(':eureka-client')

    implementation "com.amazonaws:aws-java-sdk-core:${awsVersion}"
    implementation "com.amazonaws:aws-java-sdk-ec2:${awsVersion}"
    implementation "com.amazonaws:aws-java-sdk-autoscaling:${awsVersion}"
    implementation "com.amazonaws:aws-java-sdk-sts:${awsVersion}"
    implementation "com.amazonaws:aws-java-sdk-route53:${awsVersion}"
    implementation "javax.servlet:servlet-api:${servletVersion}"
    implementation 'com.thoughtworks.xstream:xstream:1.4.17'
    implementation 'javax.ws.rs:jsr311-api:1.1.1'
    implementation 'jakarta.annotation:jakarta.annotation-api:1.3.5'

    // These dependencies are marked 'compileOnly' in the client, but we need them always on the server
    implementation "com.fasterxml.jackson.dataformat:jackson-dataformat-xml:${jacksonVersion}"
    implementation "com.fasterxml.woodstox:woodstox-core:${woodstoxVersion}"

    implementation 'com.netflix.servo:servo-core:0.13.2'
    implementation 'com.netflix.archaius:archaius-core:0.7.12'
    implementation 'javax.inject:javax.inject:1'
    implementation 'com.sun.jersey:jersey-client:1.19.4'
    implementation 'com.sun.jersey.contribs:jersey-apache-client4:1.19.4'

    testImplementation project(':eureka-test-utils')
    testImplementation "junit:junit:${junit_version}"
    testImplementation 'org.mortbay.jetty:jetty:6.1H.22'
    testImplementation "org.mock-server:mockserver-netty:${mockserverVersion}"
    testImplementation "com.jcraft:jzlib:1.1.3" // netty dependency
    testImplementation "org.mockito:mockito-core:${mockitoVersion}"
    testImplementation 'org.slf4j:slf4j-simple:1.7.10'

    annotationProcessor "com.uber.nullaway:nullaway:0.12.4-SNAPSHOT"
    annotationProcessor "edu.ucr.cs.riple.annotator:annotator-scanner:1.3.16-SNAPSHOT"

    compileOnly "com.google.code.findbugs:jsr305:3.0.2"
    errorprone "com.google.errorprone:error_prone_core:2.35.1"
    errorproneJavac "com.google.errorprone:javac:9+181-r4173-1"
    implementation "edu.ucr.cs.riple.annotator:annotation-util:1.3.16-SNAPSHOT"
    compileOnly "com.google.code.findbugs:jsr305:3.0.2"
    compileOnly "com.uber.nullaway:nullaway-annotations:0.12.4-SNAPSHOT"
}

def scanner_path = project.rootProject.projectDir.toString() + "/annotator-out/scanner.xml"
def nullaway_path = project.rootProject.projectDir.toString() + "/annotator-out/nullaway.xml"

import net.ltgt.gradle.errorprone.CheckSeverity
tasks.withType(JavaCompile) {
    // Don't run NullAway when -Derrorprone.disable=true provided on the CLI
    if (System.properties['errorprone.disable'] == 'true') {
        options.errorprone.disableAllChecks = true
        return
    }

    options.errorprone.disableAllChecks = true
    if (!name.toLowerCase().contains("test")) {
        options.errorprone.disableAllWarnings = true
        options.errorprone {
            check("NullAway", CheckSeverity.ERROR)
            check("AnnotatorScanner", CheckSeverity.ERROR)
            option("NullAway:AnnotatedPackages", "com.netflix.eureka")
            option("NullAway:SerializeFixMetadata", "true")
            option("NullAway:FixSerializationConfigPath", nullaway_path)
            option("AnnotatorScanner:ConfigPath", scanner_path)
        }
    }
    options.compilerArgs << "-Xmaxerrs" << "100000"
    options.compilerArgs << "-Xmaxwarns" << "100000"
}
